<style>

  .score b{color:var(--ink)}

  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .opt .ltr{flex:0 0 26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;display:grid;place-items:center}
  .opt .lbl{padding-top:2px}
  @media (hover:hover){ .opt:not(:disabled):hover{border-color:var(--accent);background:var(--hover)} }
  .opt:disabled{cursor:default;color:var(--ink)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .ltr{background:var(--ok);color:var(--on-strong)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .ltr{background:var(--bad);color:var(--on-strong)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .ltr{background:var(--accent);color:var(--on-strong)}
  .opt.reveal{border-color:var(--ok);border-style:dashed;background:var(--ok-bg)}
  .opt.reveal .ltr{background:var(--ok);color:var(--on-strong)}

  .actions{display:flex;gap:8px;margin-top:12px}
  .show{background:var(--accent);color:var(--on-strong);border:1px solid var(--accent);padding:7px 14px;border-radius:8px;font-weight:600;font-size:.9rem}
  .show:hover{filter:brightness(1.12)}
  .reset{background:transparent;border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-size:.9rem}
  .reset:hover{border-color:var(--accent);color:var(--accent)}
  .result{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.93rem}
  .result.good{background:var(--ok-bg)}
  .result.miss{background:var(--bad-bg)}
  .result .ref{display:block;margin-top:4px;color:var(--muted);font-size:.85rem}
  [hidden]{display:none!important}

  .next{display:flex;justify-content:flex-end;margin:8px 0 56px}
  .next .show{padding:9px 18px}

  html{-webkit-text-size-adjust:100%}
  button{touch-action:manipulation}
  .opt .lbl{min-width:0;overflow-wrap:anywhere}
  @media (max-width:640px){

    .bar h2{flex-basis:100%}

    .bar .ghost,.bar .show{flex:1 1 0;min-height:44px}
    .q{padding:14px 12px 12px;margin:12px 0}
    .q .text{font-size:1.05rem}
    .opt{min-height:48px;padding:10px}
    .actions .show,.actions .reset{flex:1;min-height:44px}

  }
  @media (prefers-reduced-motion:reduce){ .fill{transition:none} }
</style>
</head>

/* ---------- Mock tests: fixed picks from the questions above ---------- */
function seeded(seed){ return ()=> (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296; }
function shuffled(arr, rnd){
  const a = arr.slice();
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* MOCKS[0], MOCKS[1]: lists of [week, questionIndex]; 50 each, no overlap */
const MOCKS = (function(){
  const rnd = seeded(2026);
  const m = [[], []];
  WEEKS.forEach((wk, w)=>{
    const order = shuffled(wk.qs.map((_,i)=>i), rnd);
    const k = w <= 10 ? 4 : 3;               // 11*4 + 2*3 = 50 per test
    order.slice(0, k).forEach(i=>m[0].push([w,i]));
    order.slice(k, 2*k).forEach(i=>m[1].push([w,i]));
  });
  return m.map(list=>shuffled(list, rnd));
})();

/* ---------- App ---------- */
const LETTERS = "ABCDEFG";
const state = {};            // key "w-i" -> {picked, shown}
const submitted = {m1:false, m2:false};   // mock tests: answers are hidden until submitted
let view = "0";              // "0".."12" or "all"
let cards = [];              // current view's card controllers

const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function stateFor(w,i,ns){ const k = (ns||"")+w+"-"+i; return state[k] || (state[k] = {picked:null, shown:false}); }
function isLocked(s){ return s.picked !== null || s.shown; }

function weekStats(w){
  let answered = 0, correct = 0;
  WEEKS[w].qs.forEach((q,i)=>{ const s = stateFor(w,i); if(s.picked !== null){ answered++; if(s.picked === q[2]) correct++; } });
  return {answered, correct, total: WEEKS[w].qs.length};
}

function buildCard(w, i, metaText, ns){
  const q = WEEKS[w].qs[i];
  const [text, opts, ans, slide, extra] = q;
  const s = stateFor(w,i,ns);
  const examKey = ns ? ns.slice(0,-1) : null;   // "m1" / "m2" for mock tests

  const card = el("article","q");
  card.id = (ns||"").replace(":","-")+"w"+w+"q"+(i+1);
  card.appendChild(el("div","meta", metaText));
  card.appendChild(el("p","text", text));

  const list = el("div","opts");
  list.setAttribute("role","group");
  list.setAttribute("aria-label","Answer options");
  const btns = opts.map((o,k)=>{
    const b = el("button","opt"); b.type = "button";
    b.appendChild(el("span","ltr", LETTERS[k]));
    b.appendChild(el("span","lbl", o));
    b.addEventListener("click", ()=>{
      if(examKey){ if(submitted[examKey]) return; s.picked = k; paint(); refresh(); return; }   // mock: change freely until submit
      if(isLocked(s)) return; s.picked = k; paint(); refresh();
    });
    list.appendChild(b); return b;
  });
  card.appendChild(list);

  const actions = el("div","actions");
  const showBtn = el("button","show","Show answer"); showBtn.type = "button";
  const resetBtn = el("button","reset","Try again"); resetBtn.type = "button";
  actions.append(showBtn, resetBtn);
  card.appendChild(actions);

  const result = el("div","result"); result.setAttribute("aria-live","polite");
  card.appendChild(result);

  showBtn.addEventListener("click", ()=>{ if(isLocked(s)) return; s.shown = true; paint(); refresh(); resetBtn.focus(); });
  resetBtn.addEventListener("click", ()=>{ s.picked = null; s.shown = false; paint(); refresh(); showBtn.focus(); });

  function paint(){
    const locked = examKey ? submitted[examKey] : isLocked(s);
    btns.forEach((b,k)=>{
      b.disabled = locked;
      b.classList.remove("correct","wrong","reveal","sel");
      if(examKey && !locked){
        if(k === s.picked) b.classList.add("sel");            // taking the test: no right/wrong hints
      } else if(s.picked !== null){
        if(k === ans) b.classList.add("correct");
        else if(k === s.picked) b.classList.add("wrong");
      } else if((s.shown || examKey) && k === ans){
        b.classList.add("reveal");
      }
    });
    showBtn.hidden = locked || !!examKey;
    resetBtn.hidden = examKey ? true : !locked;
    actions.hidden = showBtn.hidden && resetBtn.hidden;
    result.hidden = !locked;
    result.className = "result";
    if(!locked) return;
    result.textContent = "";
    const correctText = LETTERS[ans]+". "+opts[ans];
    const line = el("div");
    if(s.picked !== null){
      if(s.picked === ans){ result.classList.add("good"); line.textContent = "Correct. " + correctText; }
      else { result.classList.add("miss"); line.textContent = "Not quite. Correct answer: " + correctText; }
    } else {
      line.textContent = (examKey ? "Not answered. Correct answer: " : "Answer: ") + correctText;
    }
    result.appendChild(line);
    const notes = [];
    if(slide) notes.push("Lecture notes, Week "+w+", slide "+slide+".");
    if(extra) notes.push(extra);
    if(!slide && w === 12) notes.push("Marked answer comes from your submission; no official key was supplied.");
    if(notes.length){ const r = el("span","ref", notes.join(" ")); result.appendChild(r); }
  }
  paint();
  return {card, reset(){ s.picked = null; s.shown = false; paint(); }};
}

const isMock = v => v === "m1" || v === "m2";

/* Everything shown in a given view, as {w, i, ns} */
function itemsFor(v){
  if(isMock(v)) return MOCKS[v === "m1" ? 0 : 1].map(([w,i])=>({w, i, ns:v+":"}));
  const weeks = v === "all" ? WEEKS.map(x=>x.n) : [Number(v)];
  const items = [];
  weeks.forEach(w=>WEEKS[w].qs.forEach((_,i)=>items.push({w, i, ns:""})));
  return items;
}
function tally(items){
  let answered = 0, correct = 0;
  items.forEach(it=>{
    const s = stateFor(it.w, it.i, it.ns);
    if(s.picked !== null){ answered++; if(s.picked === WEEKS[it.w].qs[it.i][2]) correct++; }
  });
  return {answered, correct, total: items.length};
}

function render(){
  const list = $("list"); list.textContent = "";
  const mock = isMock(view), all = view === "all";
  const items = itemsFor(view);
  let lastWeek = null;
  items.forEach((it,n)=>{
    if(all && it.w !== lastWeek){
      const h = el("h3","", "Week "+it.w);
      h.style.cssText = "font-family:var(--serif);font-size:1.15rem;margin:28px 0 -4px";
      list.appendChild(h); lastWeek = it.w;
    }
    const meta = mock ? "Question "+(n+1)+" of "+items.length+", from Week "+it.w : "Question "+(it.i+1);
    list.appendChild(buildCard(it.w, it.i, meta, it.ns).card);
  });

  $("viewTitle").textContent = all ? "All weeks" : mock ? "Mock test "+view.slice(1) : "Week "+view;
  const ban = $("banner"); ban.textContent = "";
  if(mock){
    if(submitted[view]){
      const t = tally(items);
      ban.appendChild(el("div","banner","Submitted. Score: "+t.correct+" of "+t.total+" ("+Math.round(t.correct/t.total*100)+"%). Wrong: "+(t.answered-t.correct)+". Not answered: "+(t.total-t.answered)+". Each question below now shows its answer."));
    } else {
      ban.appendChild(el("div","banner","50 questions taken from Weeks 0 to 12. Choose one option per question (you can change it) and press Submit test to see the answers and your score. The two mock tests share no questions, and each keeps the same questions and order every time."));
    }
  } else if(!all && WEEKS[Number(view)].banner){
    ban.appendChild(el("div","banner", WEEKS[Number(view)].banner));
  }

  const nb = $("nextBtn");
  const examOpen = mock && !submitted[view];
  $("submitBtn").hidden = !examOpen;
  $("submitWrap").hidden = !examOpen;
  $("resetView").textContent = mock ? (submitted[view] ? "Retake test" : "Clear answers") : "Reset this view";
  if(all || view === "m2" || view === "12"){ $("nextWrap").hidden = true; }
  else {
    $("nextWrap").hidden = false;
    nb.textContent = view === "m1" ? "Next: Mock test 2" : "Next: Week "+(Number(view)+1);
  }

  document.querySelectorAll(".chip").forEach(c=>{
    if(c.dataset.view === view){ c.setAttribute("aria-current","true"); try{ c.scrollIntoView({inline:"center", block:"nearest"}); }catch(e){} }
    else c.removeAttribute("aria-current");
  });
  refresh();
}

function refresh(){
  const t = tally(itemsFor(view));
  const open = isMock(view) && !submitted[view];
  $("score").innerHTML = open
    ? "Answered <b>"+t.answered+"</b> of "+t.total+"."
    : "Answered <b>"+t.answered+"</b> of "+t.total+". Correct <b>"+t.correct+"</b>.";
  $("fill").style.width = (t.total ? (t.answered/t.total*100) : 0) + "%";
  const left = t.total - t.answered;
  $("submitBottom").textContent = "Submit test" + (left ? " ("+left+" unanswered)" : "");
  document.querySelectorAll(".chip[data-view]").forEach(c=>{
    const v = c.dataset.view;
    if(v === "all") return;
    const st = tally(itemsFor(v));
    c.classList.toggle("done", isMock(v) ? submitted[v] : st.answered === st.total);
  });
}

function go(v, scroll){
  view = v;
  try{ if(location.hash !== "#"+v) history.replaceState(null,"","#"+v); }catch(e){ /* blocked in sandboxed previews; the week just isn't kept in the URL */ }
  render();
  if(scroll) window.scrollTo({top:0});
}

/* Build week chips */
(function(){
  const box = $("chips");
  WEEKS.forEach(w=>{
    const b = el("button","chip","Week "+w.n); b.type = "button"; b.dataset.view = String(w.n);
    b.addEventListener("click", ()=>go(String(w.n), false));
    box.appendChild(b);
  });
  const all = el("button","chip","All"); all.type = "button"; all.dataset.view = "all";
  all.addEventListener("click", ()=>go("all", false));
  box.appendChild(all);
  [["m1","Mock test 1"],["m2","Mock test 2"]].forEach(([v,label])=>{
    const m = el("button","chip",label); m.type = "button"; m.dataset.view = v;
    m.addEventListener("click", ()=>go(v, false));
    box.appendChild(m);
  });
})();

$("resetView").addEventListener("click", ()=>{
  itemsFor(view).forEach(it=>{ const s = stateFor(it.w, it.i, it.ns); s.picked = null; s.shown = false; });
  if(isMock(view)) submitted[view] = false;
  render();
});
function submitTest(){
  if(!isMock(view) || submitted[view]) return;
  submitted[view] = true;
  render();
  window.scrollTo({top:0});
}
$("submitBtn").addEventListener("click", submitTest);
$("submitBottom").addEventListener("click", submitTest);
$("nextBtn").addEventListener("click", ()=>go(view === "m1" ? "m2" : String(Number(view)+1), true));

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").setAttribute("aria-pressed", t === "dark" ? "true" : "false");
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "dark" ? "#0F151B" : "#F5F6F8");
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
$("themeBtn").addEventListener("click", ()=>{
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem("pol-theme", next); }catch(e){ /* storage blocked: choice lasts for this visit only */ }
});

const start = (location.hash || "").replace("#","");
go((start === "all" || isMock(start) || (/^\d+$/.test(start) && Number(start) <= 12)) ? start : "0", false);
</script>
